blueprint:
  name: ZHA-Wiser 4-Button Wireless Wall Switch WA5001 model
  description: 
    'Blueprint to use the Schneider Electric Wireless 4 button wall switch as a remote using ZHA Events

    Add seperate actions for each button function. 
    Supports single-press and long-press for each button, total of 8 useable functions.

    Action after long press stop can be used, but recommended to have it set as "Stop automation" to avoid infinite loops


    Works for: Wiser Exxact Battery-powered Wireless Switch 4 button

    Model nr: WA5001

    (ZigbeeID: FLS/AIRLINK/4)

    Platform: ZHA
    '
  source_url: https://raw.githubusercontent.com/BrianKlDK/briankldk.github.io/main/blueprints/zha-wiser-4-button-wa5001-dimmer-upper.yaml
  domain: automation
  
# Inputs

  input:
    wiser_ZHA_device-ID:
      name: Schneider Wiser Wireless wall switch
      description: 'Wall switch to be used to control the lights. 
      Must be a Wiser  Battery-powered Wireless Switch 4 button
      Model number: WA5001'
      selector:
        device:
          integration: zha
          manufacturer: Schneider Electric
          model: FLS/AIRLINK/4
          multiple: false
    target_light_1:
      name: Light(s) for upper buttons
      description: Light(s) to be controlled by the upper buttons
      selector:
        target:
          entity:
            domain: light

    on_bright_1:
      name: On brightness for upper buttons
      description: Brightness level in percentage when lights are turned on with the upper left button single press.
      default: 50
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: '%'
    dim_lvl_1:
      name: Dim level for upper buttons
      description: Brightness difference for each dimming step with the upper buttons.
      default: 5
      selector:
        number:
          min: 1
          max: 10
          unit_of_measurement: '%'
    dim_delay_1:
      name: Dim delay for upper buttons
      description: Delay for every dimming step with the upper buttons.
      default: 3
      selector:
        number:
          min: 1
          max: 5
          unit_of_measurement: lvl

    LHS_Down_short_press:
      name: Lower left Button single press
      description: Action to run when single press on lower-left button
      default: []
      selector:
        action: {}
    LHS_Down_long_press:
      name: Lower left Button long press
      description: Action to run when long press on lower-left button
      default: []
      selector:
        action: {}
    RHS_Down_short_press:
      name: Lower Right Button single press
      description: Action to run when single press on lower-right button
      default: []
      selector:
        action: {}
    RHS_Down_long_press:
      name: Lower Right Button long press
      description: Action to run when long press on lower-right button
      default: []
      selector:
        action: {}
    Down_Hold_stop:
      name: Lower Buttons stop after long press
      description: Action to run after long press and release on either lower buttons
      default: []
      selector:
        action: {}

mode: restart
max_exceeded: silent
trigger:
- platform: event
  event_type: zha_event
  event_data:
    device_id: !input wiser_ZHA_device-ID
action:
- variables:
    command: '{{ trigger.event.data.command }}'
    endpoint_id: '{{ trigger.event.data.endpoint_id }}'
    args: '{{ trigger.event.data.args }}'
    dim_lvl_1: !input dim_lvl_1
    dim_delay_1: !input dim_delay_1
    delay_1: '{{ dim_delay_1**2 * 30 }}' 
- choose:
  - conditions: '{{ command == ''on'' and endpoint_id == 21 }}'
    sequence: 
      - service: light.turn_on
        data:
         brightness_pct: !input on_bright_1
         transition: 1
        target: !input target_light_1
        
  - conditions: '{{ command == ''move_with_on_off'' and endpoint_id == 21 }}'
    sequence:
      - repeat:
          count: '{{ 100 / dim_lvl_1 }}'      
          sequence:
            - service: light.turn_on
              data:
                transition: 1
                brightness_step_pct: '{{ dim_lvl_1 }}'
              target: !input target_light_1
            - delay:
                hours: 0
                minutes: 0
                seconds: 0
                milliseconds: '{{ delay_1 }}'
                
  - conditions: '{{ command == ''off'' and endpoint_id == 21 }}'
    sequence:
      - service: light.turn_off
        data:
          transition: 1
        target: !input target_light_1
        
  - conditions: '{{ command == ''move'' and endpoint_id == 21 }}'
    sequence:
      - repeat:
          count: '{{ 100 / dim_lvl_1 }}'
          sequence:
            - service: light.turn_on
              data:
                transition: 1
                brightness_step_pct: '{{ dim_lvl_1 * -1 }}'
              target: !input target_light_1
            - delay:
                hours: 0
                minutes: 0
                seconds: 0
                milliseconds: '{{ delay_1 }}'
                    
  - conditions: '{{ command == ''on'' and endpoint_id == 22 }}'
    sequence: !input LHS_Down_short_press
  - conditions: '{{ command == ''move_with_on_off'' and endpoint_id == 22 }}'
    sequence: !input LHS_Down_long_press
  - conditions: '{{ command == ''off'' and endpoint_id == 22 }}'
    sequence: !input RHS_Down_short_press
  - conditions: '{{ command == ''move'' and endpoint_id == 22 }}'
    sequence: !input RHS_Down_long_press
  - conditions: '{{ command == ''stop'' and endpoint_id == 21 }}'
    sequence:
      - stop: Stop dim light 1
  - conditions: '{{ command == ''stop'' and endpoint_id == 22 }}'
    sequence: !input Down_Hold_stop
  default:
    - stop: Stop dim
